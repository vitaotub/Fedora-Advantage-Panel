<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAP - Configuração</title>
<script>
(function() {
    try {
        var t = localStorage.getItem('fap_tema') || 'escuro';
        document.documentElement.setAttribute('data-tema', t === 'claro' ? 'claro' : 'escuro');
    } catch (e) {
        document.documentElement.setAttribute('data-tema', 'escuro');
    }
})();
</script>
<link rel="stylesheet" href="style.css">
<style>
    /* Patch: manter .bloqueado sem hover nem cor de destaque
       (o .fap-sidebar-item.session-menu-item:hover tem a mesma
       especificidade do .session-menu-item.bloqueado:hover e
       aparece depois no CSS; este override com 4 classes vence). */
    .fap-sidebar-item.session-menu-item.bloqueado:hover {
        background-color: transparent;
        color: var(--text-muted);
        transform: none;
    }
    .fap-sidebar-item.session-menu-item.ativa.bloqueado:hover {
        background-color: var(--bg-secondary);
        color: var(--text-main);
    }
    /* Emoji fallback (quando SVG não disponível) */
    .fap-sidebar-item-emoji {
        font-size: 0.95rem;
        line-height: 1;
    }
    .fap-layout.colapsada .fap-sidebar-item-emoji {
        font-size: 1.05rem;
    }
    /* Indicador de busca ativa na sidebar */
    .fap-sidebar-item.busca-hit-itens .fap-sidebar-item-count {
        color: var(--accent-soft);
        font-weight: 600;
        opacity: 1;
    }
    .fap-sidebar-item.busca-hit-nome {
        outline: 1px dashed var(--text-muted);
        outline-offset: -2px;
    }
</style>
</head>

<div class="fap-layout" id="fap-layout">

function _iconeSessao(id) {
    if (SVG_ICONES_SESSOES[id]) return SVG_ICONES_SESSOES[id];
    var emoji = ICONES_SESSOES[id] || '•';
    return '<span class="fap-sidebar-item-emoji" aria-hidden="true">' + emoji + '</span>';
}

// ------------------------------------------------------------
// i18n helpers locais
// ------------------------------------------------------------
function _t(chave, fallback) {
    return (typeof tOr === 'function') ? tOr(chave, fallback) : fallback;
}
function _tVars(chave, fallback, vars) {
    return (typeof tOr === 'function') ? tOr(chave, fallback, vars) : fallback;
}

// ------------------------------------------------------------
// Carregar uma sessão específica no container
// ------------------------------------------------------------
async function carregarSessao(index) {
    var container = document.getElementById('sessao-container');
    if (!container) return;

    // Limpa o log dock ANTES de recarregar. O dock é filho de
    // <body>, não de #sessao-container, então substituir o
    // innerHTML do container não o limpa sozinho.
    _limparLogDock();

    var minhaGeracao = ++_geracaoCarregamento;

    var nomeSessao = SESSOES_PRINCIPAIS[index];
    var arquivo = nomeSessao + '.html';
    var nomeTraduzido = nomeDaSessao(nomeSessao);

    container.innerHTML = `
        <div class="loading-sessao">
            <div class="spinner"></div>
            <p>${_tVars('comum.loading_sessao', 'Carregando ' + nomeTraduzido + '...', { nome: nomeTraduzido })}</p>
        </div>
    `;

    await getProgress();

    if (minhaGeracao !== _geracaoCarregamento) return;

    try {
        var response = await fetch(arquivo);
        if (!response.ok) {
            throw new Error('Erro ao carregar ' + arquivo + ': ' + response.status);
        }

        var html = await response.text();

        if (minhaGeracao !== _geracaoCarregamento) return;
        var bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        var conteudo = bodyMatch ? bodyMatch[1] : html;
        var scriptMatch = conteudo.match(/<script[^>]*>([\s\S]*?)<\/script>/gi);
        var conteudoSemScripts = conteudo.replace(/<script[^>]*>([\s\S]*?)<\/script>/gi, '');

        container.innerHTML = conteudoSemScripts;

        container.querySelectorAll('.btn-executar').forEach(function(btn) {
            if (!btn.hasAttribute('data-texto-original')) {
                btn.setAttribute('data-texto-original', btn.textContent);
            }
        });

        // Aguarda o estado real do sistema antes de chamar restaurarEstadoSessao.
        // Sem isso, sessões com restaurarEstadoSessao SÍNCRONO (aplicativos,
        // codecs, virtualizacao, gaming, casa-escritorio, diagnostico,
        // estado-fedora, producao-multimidia, sobre-fap) leem SystemState._dados
        // = null e appJaInstaladoNoSistema retorna false para tudo — a detecção
        // de pré-existente depende da corrida entre /system-state e o fetch do
        // HTML. É a causa do "em espanhol funciona, em inglês não".
        if (typeof SystemState !== 'undefined' && typeof SystemState.carregar === 'function') {
            try { await SystemState.carregar(); } catch (e) { /* ignore */ }
        }

        if (scriptMatch) {
            scriptMatch.forEach(function(script) {
                var scriptContent = script.replace(/<script[^>]*>/, '').replace(/<\/script>/, '');
                try {
                    var win = window;
                    eval.call(win, scriptContent);
                } catch (e) {
                    console.error('Erro ao executar script:', e);
                }
            });
        }

        if (minhaGeracao !== _geracaoCarregamento) return;

        if (typeof restaurarEstadoSessao === 'function') {
            try {
                restaurarEstadoSessao();
            } catch (e) {
                console.error('Erro ao restaurar estado da sessão ' + nomeSessao + ':', e);
            }
        }

        if (typeof inicializarLogsDaSessao === 'function') {
            try {
                inicializarLogsDaSessao(container);
            } catch (e) {
                console.error('Erro ao inicializar logs da sessão ' + nomeSessao + ':', e);
            }
        }

        // Move o .terminal-log-wrapper da sessão para o dock fixo
        _moverLogParaDock(container);

        numerarSessao(nomeSessao, container);

        if (typeof I18N !== 'undefined' && typeof I18N.aplicarTraducoes === 'function') {
            I18N.aplicarTraducoes(container);
        }

        sessoesCarregadas[nomeSessao] = true;
        var event = new CustomEvent('sessao-carregada', { detail: { sessao: nomeSessao } });
        document.dispatchEvent(event);
        console.log('✅ Sessão carregada: ' + nomeSessao);

    } catch (e) {
        if (minhaGeracao !== _geracaoCarregamento) return;

        console.error('Erro ao carregar sessão:', e);
        var msgErro = _t('comum.erro_carregar_sessao', '❌ Erro ao carregar sessão');
        var msgTentar = _t('comum.btn_tentar_novamente', '🔄 Tentar novamente');
        container.innerHTML = `
            <div class="sessao-container" style="text-align:center; padding: 3rem 1rem; color: #ef4444; border: 1px solid #ef4444; border-radius: 12px;">
                <h3>${msgErro}</h3>
                <p style="color: var(--text-muted);">${e.message}</p>
                <button onclick="carregarSessao(${index})" style="margin-top: 1rem; padding: 0.5rem 1.5rem; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer;">
                    ${msgTentar}
                </button>
            </div>
        `;
    }
}

// ------------------------------------------------------------
// LOG DOCK — move o .terminal-log-wrapper da sessão para o
// painel fixo. A referência ao .terminal-log (usada pelo SSE)
// continua a mesma; só muda o pai do DOM.
// ------------------------------------------------------------

var _observadorLogDock = null;

function _limparLogDock() {
    var dock = document.getElementById('fap-log-dock');
    if (!dock) return;

    // Desconecta o MutationObserver anterior antes de recriar. Sem
    // isso, cada sessão carregada acumulava um observer vivo (o
    // `null` só perdia a referência, não parava de observar).
    if (_observadorLogDock) {
        _observadorLogDock.disconnect();
        _observadorLogDock = null;
    }

    dock.innerHTML = '';
    dock.hidden = true;
    document.body.classList.remove('log-dock-visivel', 'log-dock-expandido');
}

function _moverLogParaDock(container) {
    var dock = document.getElementById('fap-log-dock');
    if (!dock || !container) return;

    var wrapper = container.querySelector('.terminal-log-wrapper');
    if (!wrapper) {
        _limparLogDock();
        return;
    }

    dock.innerHTML = '';
    dock.appendChild(wrapper);
    dock.hidden = false;
    document.body.classList.add('log-dock-visivel');

    // O log SEMPRE inicia recolhido ao carregar uma sessão. O
    // usuário pode expandir manualmente pelo toggle; o estado não
    // persiste entre sessões nem entre reloads — por decisão de
    // UX, preferimos um ponto de partida previsível.
    var toggle = wrapper.querySelector('.terminal-log-toggle');
    var log = wrapper.querySelector('.terminal-log');
    if (toggle && log) {
        toggle.classList.remove('expandido');
        log.classList.remove('expandido');
        document.body.classList.remove('log-dock-expandido');
    }

    // Observa APENAS o toggle (não o dock inteiro com subtree).
    // Antes, qualquer mudança de classe em qualquer descendente
    // disparava o observer. Também faz dedup: só escreve no
    // localStorage quando o valor realmente muda.
    var _ultimoExpandido = false;
    _observadorLogDock = new MutationObserver(function() {
        var t = dock.querySelector('.terminal-log-toggle');
        var exp = t && t.classList.contains('expandido');
        if (exp === _ultimoExpandido) return;
        _ultimoExpandido = exp;
        document.body.classList.toggle('log-dock-expandido', !!exp);
        try { localStorage.setItem('fap_log_expandido', exp ? '1' : '0'); } catch (e) {}
    });
    if (toggle) {
        _observadorLogDock.observe(toggle, { attributes: true, attributeFilter: ['class'] });
    } else {
        // Fallback (raro): se o toggle não foi encontrado, observa
        // o dock inteiro. Mantém compatibilidade.
        _observadorLogDock.observe(dock, { attributes: true, subtree: true, attributeFilter: ['class'] });
    }
}

// SIDEBAR — criação e atualização

function criarSidebar() {
    var nav = document.getElementById('fap-sidebar-nav');
    if (!nav) return;
    if (nav.children.length > 0) return;

    var total = SESSOES_PRINCIPAIS.length;
    for (var i = 0; i < total; i++) {
        var sessaoId = SESSOES_PRINCIPAIS[i];
        var nome = nomeDaSessao(sessaoId);
        var icone = _iconeSessao(sessaoId);

        var item = document.createElement('div');
        item.className = 'session-menu-item fap-sidebar-item';
        item.dataset.index = String(i);
        item.dataset.sessao = sessaoId;
        item.setAttribute('role', 'tab');
        item.setAttribute('tabindex', '0');
        item.title = nome;

        var chaveNome = 'sessoes.' + sessaoId + '.nome';
        item.innerHTML =
            '<span class="fap-sidebar-item-icon">' + icone + '</span>' +
            '<span class="fap-sidebar-item-label" data-i18n="' + chaveNome + '">' + nome + '</span>' +
            '<span class="fap-sidebar-item-progress" data-progress aria-hidden="true"></span>' +
            '<span class="fap-sidebar-item-count" data-count></span>';

        item.addEventListener('click', function() {
            if (this.classList.contains('bloqueado')) {
                if (typeof mostrarToast === 'function') {
                    mostrarToast(_t('comum.navegacao_bloqueada',
                        'Aguarde o término dos comandos desta sessão para trocar de sessão.'),
                        'info', 4000);
                }
                return;
            }
            var idx = parseInt(this.dataset.index, 10);
            if (idx !== sessaoAtual) irParaSessao(idx);
        });

        item.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                if (this.classList.contains('bloqueado')) return;
                var idx = parseInt(this.dataset.index, 10);
                if (idx !== sessaoAtual) irParaSessao(idx);
            }
        });

        nav.appendChild(item);
    }

    atualizarSidebar();
}

function atualizarSidebar() {
    var nav = document.getElementById('fap-sidebar-nav');
    if (!nav) return;

    var itens = nav.querySelectorAll('.session-menu-item');
    itens.forEach(function(item, idx) {
        var sessaoId = item.dataset.sessao;

        item.classList.toggle('ativa', idx === sessaoAtual);
        if (idx === sessaoAtual) {
            item.setAttribute('aria-current', 'page');
        } else {
            item.removeAttribute('aria-current');
        }

        // Contagem (executados/total) e indicador de progresso
        var c = (typeof _contagemSessao === 'function')
            ? _contagemSessao(sessaoId)
            : { feitos: 0, pulados: 0, total: 0, na: false, informativa: false };

        item.classList.toggle('na', !!c.na);

        var progEl = item.querySelector('[data-progress]');
        if (progEl) {
            if (c.informativa) progEl.textContent = 'ℹ️';
            else if (c.na) progEl.textContent = '⊘';
            else if (c.total > 0 && c.feitos >= c.total) progEl.textContent = '●';
            else if (c.feitos > 0) progEl.textContent = '◐';
            else progEl.textContent = '○';
        }

        var countEl = item.querySelector('[data-count]');
        if (countEl) {
            if (c.na || c.informativa) {
                countEl.textContent = '';
                countEl.classList.remove('pulados');
            } else {
                var txt = c.feitos + '/' + c.total;
                if (c.pulados > 0) txt += ' · ' + c.pulados + '⊘';
                countEl.textContent = txt;
                countEl.classList.toggle('pulados', c.pulados > 0);
            }
        }

        item.classList.toggle('concluida', !c.informativa && !c.na && c.total > 0 && c.feitos >= c.total);

        // Tooltip com o nome da sessão (útil no modo colapsado)
        item.setAttribute('title', nomeDaSessao(sessaoId));
    });

    var ativo = nav.querySelector('.session-menu-item.ativa');
    if (ativo && typeof ativo.scrollIntoView === 'function') {
        try {
            ativo.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        } catch (e) {
            ativo.scrollIntoView(false);
        }
    }
}

// ------------------------------------------------------------
// BUSCA — configuração e renderização
// ------------------------------------------------------------

var _termoBuscaAtual = '';

function _configurarBusca() {
    var input = document.getElementById('fap-busca');
    if (!input || input.hasAttribute('data-listeners-ready')) return;
    input.setAttribute('data-listeners-ready', '1');

    var debounce = null;
    input.addEventListener('input', function() {
        clearTimeout(debounce);
        var termo = input.value.trim();
        _termoBuscaAtual = termo;

        if (termo.length < 2) {
            _resetSidebarBusca();
            return;
        }

        debounce = setTimeout(function() {
            if (typeof _buscar !== 'function') return;
            var res = _buscar(termo);
            _aplicarDestaqueBusca(res, termo);
        }, 100);
    });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            input.value = '';
            _termoBuscaAtual = '';
            _resetSidebarBusca();
        }
    });
}

function _resetSidebarBusca() {
    var nav = document.getElementById('fap-sidebar-nav');
    if (!nav) return;
    nav.querySelectorAll('.session-menu-item').forEach(function(item) {
        item.classList.remove('busca-hit-nome', 'busca-hit-itens');
    });
    atualizarSidebar();
}

function _aplicarDestaqueBusca(res, termo) {
    var nav = document.getElementById('fap-sidebar-nav');
    if (!nav) return;

    var porSessao = {};
    (res.itens || []).forEach(function(it) {
        if (!porSessao[it.sessaoId]) porSessao[it.sessaoId] = 0;
        porSessao[it.sessaoId]++;
    });
    var nomesHit = {};
    (res.sessoes || []).forEach(function(s) { nomesHit[s.id] = true; });

    nav.querySelectorAll('.session-menu-item').forEach(function(item) {
        var id = item.dataset.sessao;
        var hitNome = !!nomesHit[id];
        var hitItens = porSessao[id] || 0;

        item.classList.toggle('busca-hit-nome', hitNome && !hitItens);
        item.classList.toggle('busca-hit-itens', hitItens > 0);

        var countEl = item.querySelector('[data-count]');
        if (!countEl) return;

        if (hitItens > 0) {
            // Sessão tem itens que casam: mostra "N item(ns)".
            countEl.textContent = hitItens + ' ' +
                (hitItens === 1
                    ? _t('busca.item', 'item')
                    : _t('busca.itens', 'itens'));
            countEl.classList.add('pulados');
        } else {
            // Sem hit: restaura a contagem de progresso normal,
            // sem herdar estado da busca anterior.
            var c = (typeof _contagemSessao === 'function')
                ? _contagemSessao(id)
                : { feitos: 0, pulados: 0, total: 0, na: false };
            if (c.na) {
                countEl.textContent = '';
                countEl.classList.remove('pulados');
            } else {
                var txt = c.feitos + '/' + c.total;
                if (c.pulados > 0) txt += ' · ' + c.pulados + '⊘';
                countEl.textContent = txt;
                countEl.classList.toggle('pulados', c.pulados > 0);
            }
        }
    });
}

// ------------------------------------------------------------
// N/A
// ------------------------------------------------------------

function _configurarNA() {
    var btn = document.getElementById('fap-na-btn');
    if (btn && !btn.hasAttribute('data-listener-ready')) {
        btn.setAttribute('data-listener-ready', '1');
        btn.addEventListener('click', function() {
            var sessaoId = SESSOES_PRINCIPAIS[sessaoAtual];
            if (!sessaoId) return;
            if (typeof _sessaoNA === 'function' && _sessaoNA(sessaoId)) {
                _desmarcarSessaoNA(sessaoId);
            } else {
                _marcarSessaoNA(sessaoId);
            }
            _atualizarNAUI();
            atualizarSidebar();
        });
    }
    var bannerLimpar = document.getElementById('fap-na-banner-limpar');
    if (bannerLimpar && !bannerLimpar.hasAttribute('data-listener-ready')) {
        bannerLimpar.setAttribute('data-listener-ready', '1');
        bannerLimpar.addEventListener('click', function() {
            var sessaoId = SESSOES_PRINCIPAIS[sessaoAtual];
            if (!sessaoId) return;
            _desmarcarSessaoNA(sessaoId);
            _atualizarNAUI();
            atualizarSidebar();
        });
    }
}

function _atualizarNAUI() {
    var sessaoId = SESSOES_PRINCIPAIS[sessaoAtual];
    var ativo = sessaoId && typeof _sessaoNA === 'function' && _sessaoNA(sessaoId);

    var btn = document.getElementById('fap-na-btn');
    if (btn) {
        btn.classList.toggle('ativo', !!ativo);
        var label = btn.querySelector('.fap-sidebar-na-label');
        if (label) {
            label.textContent = ativo
                ? _t('sidebar.na_btn_ativo', 'Desmarcar N/A')
                : _t('sidebar.na_btn', 'Marcar esta sessão como N/A');
        }
    }

    var banner = document.getElementById('fap-na-banner');
    if (banner) banner.hidden = !ativo;
}

// ------------------------------------------------------------
// HAMBURGER (mobile) e BACKDROP
// ------------------------------------------------------------

function _configurarHamburger() {
    var hamburger = document.getElementById('fap-hamburger');
    var sidebar = document.getElementById('fap-sidebar');
    var backdrop = document.getElementById('fap-sidebar-backdrop');

    if (hamburger && !hamburger.hasAttribute('data-listener-ready')) {
        hamburger.setAttribute('data-listener-ready', '1');
        hamburger.addEventListener('click', function() {
            if (!sidebar) return;
            sidebar.classList.add('aberta');
            if (backdrop) backdrop.classList.add('visivel');
        });
    }
    if (backdrop && !backdrop.hasAttribute('data-listener-ready')) {
        backdrop.setAttribute('data-listener-ready', '1');
        backdrop.addEventListener('click', function() {
            if (sidebar) sidebar.classList.remove('aberta');
            backdrop.classList.remove('visivel');
        });
    }
}

// ------------------------------------------------------------
// REFRESH e FILTRO
// ------------------------------------------------------------

function _configurarRefresh() {
    var btn = document.getElementById('btn-refresh-estado');
    if (!btn || btn.hasAttribute('data-listener-ready')) return;
    btn.setAttribute('data-listener-ready', '1');
    btn.addEventListener('click', function() {
        if (typeof _refreshEstadoSessao === 'function') {
            _refreshEstadoSessao();
        }
    });
}

function _configurarFiltroBanner() {
    var btn = document.getElementById('fap-filtro-banner-limpar');
    if (!btn || btn.hasAttribute('data-listener-ready')) return;
    btn.setAttribute('data-listener-ready', '1');
    btn.addEventListener('click', function() {
        if (typeof _limparFiltroSessao === 'function') {
            _limparFiltroSessao();
        }
        // Também limpa o input de busca
        var input = document.getElementById('fap-busca');
        if (input) input.value = '';
        _termoBuscaAtual = '';
        _resetSidebarBusca();
    });
}

// Quando o índice de busca termina de ser construído, re-roda a
// busca se o usuário já tinha digitado algo. Sem isso, uma busca
// feita antes do preload terminar (primeiros ~1-3s após abrir o
// FAP) retornava vazia e não era refeita.
document.addEventListener('fap-indice-pronto', function() {
    if (_termoBuscaAtual && _termoBuscaAtual.length >= 2 && typeof _buscar === 'function') {
        var res = _buscar(_termoBuscaAtual);
        _aplicarDestaqueBusca(res, _termoBuscaAtual);
    }
});

// ------------------------------------------------------------
// NAVEGAÇÃO
// ------------------------------------------------------------

function irParaSessaoInicial() {
    var total = SESSOES_PRINCIPAIS.length;

    try {
        var params = new URLSearchParams(window.location.search);
        var sessaoAlvo = params.get('session');
        if (sessaoAlvo && SESSOES_PRINCIPAIS.indexOf(sessaoAlvo) !== -1) {
            var idx = SESSOES_PRINCIPAIS.indexOf(sessaoAlvo);
            irParaSessao(idx);
            return;
        }
    } catch (e) { /* ignore */ }

    try {
        var salvo = parseInt(localStorage.getItem('fap_sessao_ativa'), 10);
        if (!isNaN(salvo) && salvo >= 0 && salvo < total) {
            irParaSessao(salvo);
            return;
        }
    } catch (e) { /* ignore */ }

    irParaSessao(0);
}

function irParaSessao(index) {
    var total = SESSOES_PRINCIPAIS.length;
    if (index < 0 || index >= total) return;

    sessaoAtual = index;

    try {
        localStorage.setItem('fap_sessao_ativa', String(index));
    } catch (e) { /* ignore */ }

    // Aplicar filtro de busca após o carregamento? Determinado
    // ANTES de limpar o termo, para não perder a intenção.
    var termoAtivo = '';
    var input = document.getElementById('fap-busca');
    if (input) termoAtivo = input.value.trim();

    var deveAplicarFiltro = false;
    if (termoAtivo.length >= 2 && typeof _buscar === 'function') {
        try {
            var res = _buscar(termoAtivo);
            if (res.itens && res.itens.some(function(it) {
                return it.sessaoId === SESSOES_PRINCIPAIS[index];
            })) {
                deveAplicarFiltro = true;
            }
        } catch (e) { /* ignore */ }
    }

    // Trocar de sessão sempre limpa o filtro anterior
    if (typeof _limparFiltroSessao === 'function') {
        _limparFiltroSessao();
    }

    carregarSessao(index);

    var btnAnterior = document.getElementById('btn-anterior');
    var btnProximo = document.getElementById('btn-proximo');
    var infoSessao = document.getElementById('info-sessao');

    if (btnAnterior) btnAnterior.disabled = (index === 0);
    if (btnProximo) btnProximo.disabled = (index === total - 1);

    if (infoSessao) {
        infoSessao.innerHTML = _tVars(
            'comum.sessao_info_nav',
            '<strong>' + (index + 1) + '/' + total + '</strong> - ' + nomeDaSessao(SESSOES_PRINCIPAIS[index]),
            { n: index + 1, total: total, nome: nomeDaSessao(SESSOES_PRINCIPAIS[index]) }
        );
    }

    atualizarBarraPosicao(index, total);
    atualizarSidebar();
    _atualizarNAUI();

    setTimeout(carregarProgressoInicial, 300);

    // Aplica filtro se o usuário veio de uma busca. Também limpa
    // o termo de busca (é efêmero: a próxima navegação via
    // sidebar não deve reaplicar).
    if (deveAplicarFiltro && input) {
        // Guarda o termo para usar depois que o HTML carregar
        var termoParaAplicar = termoAtivo;
        setTimeout(function() {
            if (typeof _aplicarFiltroSessao === 'function') {
                _aplicarFiltroSessao(termoParaAplicar);
            }
        }, 500);
        // Limpa o input (a barra de busca fica "vazia" visualmente),
        // mas mantém _termoBuscaAtual durante o carregamento para
        // preservar o destaque da sidebar. Zeramos ao final.
        // Guard: só limpa se o input ainda contém o termo original.
        // Se o usuário digitou algo novo nesse intervalo, preserva
        // (evita race: "digitei, cliquei, comecei a digitar de novo
        // e o termo novo foi apagado").
        setTimeout(function() {
            if (!input || input.value !== termoAtivo) return;
            input.value = '';
            _termoBuscaAtual = '';
            _resetSidebarBusca();
        }, 800);
    }
}

function atualizarBarraPosicao(atual, total) {
    var fill = document.getElementById('progress-guia-fill');
    var text = document.getElementById('progress-guia-text');
    if (fill) {
        var percent = ((atual + 1) / total) * 100;
        fill.style.width = percent + '%';
    }
    if (text) {
        text.textContent = _tVars(
            'comum.sessao_posicao',
            (atual + 1) + ' de ' + total,
            { atual: atual + 1, total: total }
        );
    }
}

function sessaoAnterior() {
    if (sessaoAtual > 0) irParaSessao(sessaoAtual - 1);
}

function proximaSessao() {
    var total = SESSOES_PRINCIPAIS.length;
    if (sessaoAtual < total - 1) {
        irParaSessao(sessaoAtual + 1);
    }
}

// ============================================================
// SOBRESCRITAS (progresso → sidebar)
// ============================================================

var marcarComoExecutadoOriginal = marcarComoExecutado;
var desmarcarComoExecutadoOriginal = desmarcarComoExecutado;

marcarComoExecutado = async function(idComando) {
    await marcarComoExecutadoOriginal(idComando);
    setTimeout(function() {
        atualizarSidebar();
        _atualizarNAUI();
    }, 100);
};

desmarcarComoExecutado = async function(idComando) {
    await desmarcarComoExecutadoOriginal(idComando);
    atualizarSidebar();
    _atualizarNAUI();
};

// ============================================================
// REAPLICAÇÃO DE TEXTOS DINÂMICOS
// ============================================================

function _reaplicarTextosDinamicos() {
    var total = SESSOES_PRINCIPAIS.length;
    if (total === 0) return;

    if (sessaoAtual < 0 || sessaoAtual >= total) sessaoAtual = 0;

    atualizarBarraPosicao(sessaoAtual, total);

    var infoSessao = document.getElementById('info-sessao');
    if (infoSessao) {
        var nomeAtual = nomeDaSessao(SESSOES_PRINCIPAIS[sessaoAtual]);
        infoSessao.innerHTML = _tVars(
            'comum.sessao_info_nav',
            '<strong>' + (sessaoAtual + 1) + '/' + total + '</strong> - ' + nomeAtual,
            { n: sessaoAtual + 1, total: total, nome: nomeAtual }
        );
    }

    var container = document.getElementById('sessao-container');
    if (container && typeof numerarSessao === 'function') {
        numerarSessao(SESSOES_PRINCIPAIS[sessaoAtual], container);
    }

    var nav = document.getElementById('fap-sidebar-nav');
    if (nav && typeof I18N !== 'undefined' && typeof I18N.aplicarTraducoes === 'function') {
        I18N.aplicarTraducoes(nav);
    }

    atualizarSidebar();
    _atualizarNAUI();
}

document.addEventListener('i18n-pronto', function() {
    setTimeout(_reaplicarTextosDinamicos, 100);
});

// ============================================================
// LISTENERS
// ============================================================

document.addEventListener('sessao-carregada', function(e) {
    setTimeout(function() {
        atualizarSidebar();
        _reaplicarTextosDinamicos();
    }, 150);

    // Aplicar filtro de busca pós-carregamento se houver termo ativo
    // e a sessão casar com itens. Este listener roda DEPOIS do
    // carregamento bem-sucedido (o evento é disparado no fim de
    // carregarSessao).
    if (_termoBuscaAtual && _termoBuscaAtual.length >= 2 && e && e.detail && e.detail.sessao) {
        setTimeout(function() {
            if (typeof _aplicarFiltroSessao === 'function' && typeof _buscar === 'function') {
                try {
                    var res = _buscar(_termoBuscaAtual);
                    if (res.itens && res.itens.some(function(it) {
                        return it.sessaoId === e.detail.sessao;
                    })) {
                        // Não reaplica se o irParaSessao já cuidou disso
                        if (typeof _filtroAtual !== 'undefined' && !_filtroAtual) {
                            _aplicarFiltroSessao(_termoBuscaAtual);
                        }
                    }
                } catch (err) { /* ignore */ }
            }
        }, 200);
    }
});

// ============================================================
// INICIALIZAÇÃO
// ============================================================

document.addEventListener('DOMContentLoaded', function() {
    if (typeof I18N !== 'undefined' && typeof I18N.criarSeletorIdioma === 'function') {
        I18N.criarSeletorIdioma();
    }

    if (typeof criarBotaoTema === 'function') {
        criarBotaoTema();
    }

    var loadingTexto = document.getElementById('loading-inicial-texto');
    if (loadingTexto) {
        loadingTexto.textContent = _t('comum.spinner_carregando_sessao', 'Carregando sessão...');
    }

    // Configurações específicas do guiado
    var toggleBtn = document.getElementById('fap-sidebar-toggle');
    if (toggleBtn && !toggleBtn.hasAttribute('data-listener-ready')) {
        toggleBtn.setAttribute('data-listener-ready', '1');
        toggleBtn.addEventListener('click', function() {
            if (typeof _alternarSidebar === 'function') _alternarSidebar();
        });
    }

    _configurarBusca();
    _configurarNA();
    _configurarHamburger();
    _configurarRefresh();
    _configurarFiltroBanner();

    if (typeof getProgress !== 'undefined' && typeof SESSOES_PRINCIPAIS !== 'undefined') {
        criarSidebar();
        irParaSessaoInicial();
    } else {
        console.warn('⏳ Aguardando script.js carregar...');
        setTimeout(function() {
            if (typeof getProgress !== 'undefined' && typeof SESSOES_PRINCIPAIS !== 'undefined') {
                criarSidebar();
                irParaSessaoInicial();
            } else {
                console.error('❌ script.js não foi carregado!');
                var msgErro = _t('comum.erro_script_js', '❌ Erro: script.js não foi carregado!');
                var msgDica = _t('comum.erro_script_js_msg', 'Recarregue a página ou verifique se o arquivo existe.');
                document.getElementById('sessao-container').innerHTML = `
                    <div class="sessao-container" style="text-align:center; padding: 3rem 1rem; color: #ef4444; border: 1px solid #ef4444;">
                        <h3>${msgErro}</h3>
                        <p style="color: var(--text-muted);">${msgDica}</p>
                    </div>
                `;
            }
        }, 200);
    }
});
</script>
