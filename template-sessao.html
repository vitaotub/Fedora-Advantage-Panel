<!--
============================================================
MOLDE PARA UMA NOVA SESSÃO DO FAP
============================================================

Como usar:
1. Copie este arquivo para nome-da-sessao.html (sem número).
   Os IDs de sessão são semânticos desde a v1.0.0-09282026 —
   a ordem de exibição vem da posição no array SESSOES em
   script.js, não do nome do arquivo. Ex.: emuladores.html.
2. Troque os placeholders entre <> pelo conteúdo real.
3. Adicione uma entrada no array SESSOES, em script.js, com o
   mesmo id do arquivo (sem o .html) e os data-comando dos seus
   botões. Adicione também o emoji em ICONES_SESSOES (guiado.html).
   Não precisa editar mais nada — nem index.html, nem server.js.
4. Apague este comentário e os comentários "MOLDE:" abaixo.

Este molde traz UM botão simples (instalar). Pra ver outros
padrões prontos:
- Botão sempre clicável (ação repetível, nunca desabilita):
  veja 'atualizacao-inicial' em primeiros-passos.html e a flag
  sempreClicavel em script.js.
- Flatpak com detecção de remoção externa: adicione
  `flatpakId: 'org.exemplo.App'` no registro de script.js e o
  botão ganha o ícone de lixeira automaticamente. Veja
  'instalar-vlc' em aplicativos.html.
- Vários botões instalar em grade, cada um independente:
  veja gaming.html (bloco "Launchers").
- Botão com par "aplicar/reverter" (dois botões independentes,
  ambos sempre clicáveis): veja 'amdgpu-overclock' e
  'amdgpu-overclock-remove' em hardware.html.
- Dropdown + botão "aplicar valor selecionado": veja o ajuste de
  DNF em ajustes-manutencao.html.
- Fluxo mais elaborado (dropdown populado dinamicamente, duas
  confirmações, bloqueio condicional): veja o gerenciamento de
  kernels em ajustes-manutencao.html.
- Detecção de hardware via endpoint (estado real via rpm -q, não
  progresso do .progresso.json): veja dispositivos-perifericos.html.

IMPORTANTE — o FAP não tem botões de "desfazer" genéricos. Se
uma ação tiver um "desfazer" com sentido, modele como um
segundo botão independente, também sempre clicável (ver o par
grub-aplicar-recomendado / grub-restaurar-padrao em
ajustes-manutencao.html e o par amdgpu-overclock em hardware.html).
============================================================
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAP - <!-- MOLDE: título da aba, ex.: "Emuladores" --></title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ===== CONTEÚDO DA SESSÃO ===== -->
<!--
O id="sessao-nome-da-sessao" deve ser "sessao-" + o mesmo id que
você usar no array SESSOES em script.js (sem número — os IDs são
semânticos). O texto dentro de .sessao-label ("Sessão N") é
preenchido automaticamente — não precisa escrever o número certo
aqui.
-->
<div class="sessao-container" id="sessao-nome-da-sessao">
<div class="sessao-titulo">
<span class="sessao-label">Sessão</span>
<!-- MOLDE: emoji + título, ex.: "🕹️ Emuladores" -->
</div>

<div class="bloco-comando">
<div class="comando-info">
<h3><!-- MOLDE: nome curto do que este botão faz --></h3>
<p><!-- MOLDE: explicação de uma ou duas frases --></p>

<div class="grupo-botoes">
<!--
data-comando é o ID que conecta este botão ao
registro em script.js (SESSOES) e ao progresso
salvo no servidor. Use um ID único no projeto
inteiro, em minúsculas com hífen.
-->
<button class="btn-executar" onclick="executarMeuComando()" data-comando="meu-comando-novo" id="btn-meu-comando-novo">
<!-- MOLDE: texto do botão, ex.: "🕹️ Instalar RetroArch" -->
</button>
</div>
</div>

<div class="progress-container" id="progress-meu-comando-novo">
<div class="progress-bar"><div class="progress-fill" id="progress-fill-meu-comando-novo"></div></div>
<div class="progress-text"><span class="status" id="progress-status-meu-comando-novo">⏳ Iniciando...</span><span class="percentage" id="progress-percent-meu-comando-novo">0%</span></div>
</div>
<div class="terminal-log" id="log-meu-comando-novo"></div>
</div>
</div>

<!-- ===== JAVASCRIPT ESPECÍFICO DA SESSÃO ===== -->
<script>
/**
* MOLDE: troque pelo comando real (dnf, flatpak, script, o que for).
* executarComandoGenerico já cuida do texto "instalando...", da
* barra de progresso, do log em tempo real (SSE) e de marcar o
* botão como concluído ao final.
*/
async function executarMeuComando() {
const comando = 'flatpak install flathub org.exemplo.Programa -y';
await executarComandoGenerico('meu-comando-novo', comando, 'Instalando <!-- MOLDE: nome do programa -->');
}

// ===== RESTAURAR ESTADO DA SESSÃO =====
// Chamada automaticamente pelo Modo Guiado assim que esta sessão é
// carregada — não precisa ser adicionada a nenhum outro lugar.
function restaurarEstadoSessao() {
if (isExecutado('meu-comando-novo')) {
const btn = document.getElementById('btn-meu-comando-novo');
if (btn) {
btn.textContent = getTextoAposExecucao('meu-comando-novo');
btn.style.backgroundColor = '#4b5563';
btn.style.cursor = 'default';
btn.disabled = true;
}
}
}
</script>
</body>
</html>
